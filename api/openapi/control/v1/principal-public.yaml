                          }
                        },
                        "state": {
                          "enum": [
                            "ACTIVE",
                            "REVOKED"
                          ]
                        },
                        "revision": {
                          "type": "integer",
                          "minimum": 1,
                          "maximum": 9007199254740991
                        },
                        "created_by": {
