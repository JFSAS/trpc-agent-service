        "operationId": "registerChannelPrincipal",
        "tags": [
          "Channel"
        ],
        "summary": "registerChannelPrincipal",
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "description": "Requires an active unrestricted Session and tenant OWNER before body parsing; transaction rechecks OWNER. Body limit 16 KiB. No query parameters or Content-Encoding. Idempotency replay preserves original status and identity result. ACTIVE is an identity record, not a runtime access grant. NOT_EMITTED does not prove runtime revocation. Account and provider identity are resolved within the authenticated tenant; body tenant/provider/role overrides are rejected.",
        "responses": {
          "400": {
            "description": "Closed input invalid",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "401": {
