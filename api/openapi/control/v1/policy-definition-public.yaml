{
  "openapi": "3.1.0",
  "info": {
    "title": "Channel policy definition publication",
    "version": "1.0.0"
  },
  "paths": {
    "/v1/tenants/{tenant_id}/channel-policy-definitions/{kind}/{policy_id}/revisions": {
      "parameters": [
        {
          "name": "tenant_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
            "not": {
              "pattern": "[^A-Za-z0-9._:-]"
            }
          }
        },
        {
          "name": "kind",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "enum": [
              "session",
              "quota"
            ]
          }
        },
        {
          "name": "policy_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
            "not": {
              "pattern": "[^A-Za-z0-9._:-]"
            }
          }
        }
      ],
      "post": {
        "operationId": "publishChannelPolicyDefinition",
        "tags": [
          "Channel"
        ],
        "summary": "Publish immutable Session or Quota definition",
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "description": "Requires active unrestricted Session and tenant OWNER before body parsing, and OWNER recheck in the transaction. Mandatory Idempotency-Key, 16KiB body limit, no query or Content-Encoding. expected_revision=0 creates the first immutable revision. CAS, MAC receipt, publication and audit outboxes commit atomically. Replay returns the same 201 result. PENDING is not runtime application confirmation. The path kind must match the single definition branch. Public-limited quotas must have positive limits. Definition publication neither binds an account nor enables runtime enforcement.",
        "responses": {
          "400": {
            "description": "Closed input invalid",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "403": {
            "description": "OWNER permission denied",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "409": {
            "description": "Revision, identity or idempotency conflict",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "413": {
            "description": "Body limit exceeded",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "500": {
            "description": "Stored result integrity failure",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "201": {
            "description": "Immutable reference and pending outbox; no runtime activation claim.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "tenant_id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "kind": {
                      "type": "string",
                      "enum": [
                        "session",
                        "quota"
                      ]
                    },
                    "policy_id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "revision": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 9007199254740991
                    },
                    "digest": {
                      "type": "string",
                      "pattern": "^sha256:[0-9a-f]{64}$"
                    },
                    "event_id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "audit_event_id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "distribution": {
                      "type": "string",
                      "const": "PENDING"
                    }
                  },
                  "required": [
                    "tenant_id",
                    "kind",
                    "policy_id",
                    "revision",
                    "digest",
                    "event_id",
                    "audit_event_id",
                    "distribution"
                  ]
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128,
              "pattern": "^[!-~]+$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "expected_revision": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 9007199254740991
                  },
                  "definition": {
                    "oneOf": [
                      {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "enabled": {
                            "type": "boolean"
                          },
                          "session": {
                            "type": "object",
                            "additionalProperties": false,
                            "properties": {
                              "partition": {
                                "enum": [
                                  "per_user_in_conversation",
                                  "shared_conversation"
                                ]
                              }
                            },
                            "required": [
                              "partition"
                            ]
                          }
                        },
                        "required": [
                          "enabled",
                          "session"
                        ]
                      },
                      {
                        "type": "object",
                        "additionalProperties": false,
                        "properties": {
                          "enabled": {
                            "type": "boolean"
                          },
                          "quota": {
                            "type": "object",
                            "additionalProperties": false,
                            "properties": {
                              "public_limited": {
                                "type": "boolean"
                              },
                              "max_concurrent_runs": {
                                "type": "integer",
                                "minimum": 0,
                                "maximum": 9007199254740991
                              },
                              "max_runs_per_minute": {
                                "type": "integer",
                                "minimum": 0,
                                "maximum": 9007199254740991
                              }
                            },
                            "required": [
                              "public_limited",
                              "max_concurrent_runs",
                              "max_runs_per_minute"
                            ]
                          }
                        },
                        "required": [
                          "enabled",
                          "quota"
                        ]
                      }
                    ]
                  }
                },
                "required": [
                  "expected_revision",
                  "definition"
                ]
              }
            }
          }
        }
      }
    },
    "/v1/tenants/{tenant_id}/channel-policy-definitions/{kind}/{policy_id}/revisions/{revision}": {
      "parameters": [
        {
          "name": "tenant_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
            "not": {
              "pattern": "[^A-Za-z0-9._:-]"
            }
          }
        },
        {
          "name": "kind",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "enum": [
              "session",
              "quota"
            ]
          }
        },
        {
          "name": "policy_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
            "not": {
              "pattern": "[^A-Za-z0-9._:-]"
            }
          }
        },
        {
          "name": "revision",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,15}$"
          },
          "description": "Canonical positive decimal, at most 9007199254740991. No latest or leading zero."
        }
      ],
      "get": {
        "operationId": "getChannelPolicyDefinitionRevision",
        "summary": "Read an exact published Session or Quota definition",
        "tags": [
          "Channel"
        ],
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "description": "Current unrestricted Session and tenant OWNER required. Tenant/kind/id/revision are exact; a reference grants no read access. No query, GET body, Content-Encoding, listing or latest alias. Revalidates full persisted definition digest; errors omit private backend details.",
        "responses": {
          "400": {
            "description": "Invalid canonical path, query or GET body",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "401": {
            "description": "Unauthenticated",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "403": {
            "description": "Current OWNER required",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "404": {
            "description": "Exact tenant/kind/id/revision not found",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "500": {
            "description": "Stored definition integrity error",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "503": {
            "description": "Dependency unavailable",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "200": {
            "description": "Exact immutable document after full digest verification; no-store. Not runtime activation status.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "tenant_id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "kind": {
                      "type": "string",
                      "enum": [
                        "session",
                        "quota"
                      ]
                    },
                    "policy_id": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "revision": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 9007199254740991
                    },
                    "digest": {
                      "type": "string",
                      "pattern": "^sha256:[0-9a-f]{64}$"
                    },
                    "schema_version": {
                      "type": "integer",
                      "const": 1
                    },
                    "definition": {
                      "oneOf": [
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "properties": {
                            "enabled": {
                              "type": "boolean"
                            },
                            "session": {
                              "type": "object",
                              "additionalProperties": false,
                              "properties": {
                                "partition": {
                                  "enum": [
                                    "per_user_in_conversation",
                                    "shared_conversation"
                                  ]
                                }
                              },
                              "required": [
                                "partition"
                              ]
                            }
                          },
                          "required": [
                            "enabled",
                            "session"
                          ]
                        },
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "properties": {
                            "enabled": {
                              "type": "boolean"
                            },
                            "quota": {
                              "type": "object",
                              "additionalProperties": false,
                              "properties": {
                                "public_limited": {
                                  "type": "boolean"
                                },
                                "max_concurrent_runs": {
                                  "type": "integer",
                                  "minimum": 0,
                                  "maximum": 9007199254740991
                                },
                                "max_runs_per_minute": {
                                  "type": "integer",
                                  "minimum": 0,
                                  "maximum": 9007199254740991
                                }
                              },
                              "required": [
                                "public_limited",
                                "max_concurrent_runs",
                                "max_runs_per_minute"
                              ]
                            }
                          },
                          "required": [
                            "enabled",
                            "quota"
                          ]
                        }
                      ]
                    },
                    "published_by": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 128,
                      "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$",
                      "not": {
                        "pattern": "[^A-Za-z0-9._:-]"
                      }
                    },
                    "published_at": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "tenant_id",
                    "kind",
                    "policy_id",
                    "revision",
                    "digest",
                    "schema_version",
                    "definition",
                    "published_by",
                    "published_at"
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "cookieAuth": {
        "type": "apiKey",
        "in": "cookie",
        "name": "control_session"
      }
    }
  }
}
