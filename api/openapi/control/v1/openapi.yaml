openapi: 3.1.0
info:
  title: Control API
  version: 1.0.0
  description: V1 HTTP contract for Identity, platform administration, Tenant membership, and Agent authoring.
servers:
  - url: /
tags:
  - name: Health
  - name: Identity
  - name: Admin
  - name: Tenant
  - name: Agent
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      tags: [Health]
      responses:
        '204':
          description: The process is serving requests.
  /v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Log in with a local username and password
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded and a server-side session was created.
          headers:
            Set-Cookie:
              description: HttpOnly opaque session cookie. The token is never returned in JSON.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: The per-process, per-peer login attempt limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until the current fixed window expires.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Identity]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      tags: [Identity]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current identity and password rotation state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me/change-password:
    post:
      operationId: changeCurrentPassword
      summary: Replace the current password and unlock a restricted session
      tags: [Identity]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204':
          description: Password changed; other sessions were revoked.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me/tenants:
    get:
      operationId: listMyTenants
      summary: List Tenant memberships for the current user
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant memberships.
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: {$ref: '#/components/schemas/TenantMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: getTenant
      summary: Get a Tenant visible to the current member
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant and caller role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listTenantMembers
      summary: List members of a Tenant
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: addTenantMember
      summary: Add an existing active user as a Tenant member
      tags: [Tenant]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: removeTenantMember
      summary: Remove a non-owner member from a Tenant
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Membership removed.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: createAgent
      summary: Create an Agent and its initial Draft atomically
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequest'}
      responses:
        '201':
          description: Agent and initial Draft created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateAgentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listAgents
      summary: List Agents in the Tenant
      tags: [Agent]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of Agents.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: getAgent
      summary: Get an Agent
      tags: [Agent]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Agent metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateAgent
      summary: Update mutable Agent metadata
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequest'}
      responses:
        '200':
          description: Updated Agent metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/draft:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: getAgentDraft
      summary: Get the current mutable Agent Draft
      tags: [Agent]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current Agent Draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDraft'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: saveAgentDraft
      summary: Compare-and-swap the current Agent Draft
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveAgentDraftRequest'}
      responses:
        '200':
          description: Draft saved at the next revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDraft'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AgentSpecInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/draft/validate:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    post:
      operationId: validateAgentDraft
      summary: Validate one exact Draft revision for publication
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftRevisionRequest'}
      responses:
        '200':
          description: Validation completed; valid may be false.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    post:
      operationId: publishAgentVersion
      summary: Publish an immutable version from one exact Draft revision
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftRevisionRequest'}
      responses:
        '200':
          description: The same Draft revision was already published; its Version is returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishAgentVersionResponse'}
        '201':
          description: A new immutable Agent Version was published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishAgentVersionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AgentSpecInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listAgentVersions
      summary: List immutable versions of an Agent
      tags: [Agent]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of immutable Agent Versions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentVersionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/versions/{version_number}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
      - $ref: '#/components/parameters/VersionNumber'
    get:
      operationId: getAgentVersion
      summary: Get one immutable Agent Version including Canonical AgentSpec
      tags: [Agent]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Immutable Agent Version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentVersion'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/capabilities:
    get:
      operationId: getAdminCapabilities
      summary: Get fixed V1 platform administration capabilities
      tags: [Admin]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Active operator capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/operators:
    get:
      operationId: listPlatformOperators
      summary: List active Platform Operators
      tags: [Admin]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Active Platform Operators.
          content:
            application/json:
              schema:
                type: object
                required: [operators]
                properties:
                  operators:
                    type: array
                    items: {$ref: '#/components/schemas/Operator'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: grantPlatformOperator
      summary: Grant platform administration to an existing active user
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantOperatorRequest'}
      responses:
        '201':
          description: Operator grant is active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operator'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/operators/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: revokePlatformOperator
      summary: Revoke a Platform Operator while preserving at least one operator
      tags: [Admin]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Operator grant revoked.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/users:
    get:
      operationId: listPlatformUsers
      summary: List global platform users
      tags: [Admin]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of global users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createPlatformUser
      summary: Create an active user with a temporary password
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Global user created; password change is required on first login.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/tenants:
    get:
      operationId: listTenantsForOperations
      summary: List Tenants for platform operations
      tags: [Admin]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of Tenants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: provisionTenant
      summary: Create a Tenant and an initial owner membership
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisionTenantRequest'}
      responses:
        '201':
          description: Tenant and initial owner membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: control_session
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    AgentID:
      name: agent_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionNumber:
      name: version_number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    UserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    BadRequest:
      description: Request input is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: A valid session is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: The authenticated user is not authorized or must change a temporary password.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: The requested state change conflicts with current state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AgentSpecInvalid:
      description: The AgentSpec cannot be stored safely or published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentValidationErrorResponse'}
    InternalError:
      description: The request could not be completed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    Agent:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, description, latest_version_number, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        name: {type: string}
        description: {type: string}
        latest_version_number: {type: integer, minimum: 1, nullable: true}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentDraft:
      type: object
      additionalProperties: false
      required: [agent_id, tenant_id, revision, spec, updated_by, updated_at]
      properties:
        agent_id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer, minimum: 1}
        spec:
          type: object
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    AgentVersion:
      type: object
      additionalProperties: false
      required: [id, tenant_id, agent_id, version_number, source_draft_revision, schema_version, spec, spec_digest, published_by, published_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        agent_id: {type: string}
        version_number: {type: integer, minimum: 1}
        source_draft_revision: {type: integer, minimum: 1}
        schema_version: {type: string, enum: [v1]}
        spec:
          $ref: '../../../schemas/agentspec/v1/agent-spec.schema.json'
        spec_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        published_by: {type: string}
        published_at: {type: string, format: date-time}
    CreateAgentResponse:
      type: object
      additionalProperties: false
      required: [agent, draft]
      properties:
        agent: {$ref: '#/components/schemas/Agent'}
        draft: {$ref: '#/components/schemas/AgentDraft'}
    SaveAgentDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, spec]
      properties:
        expected_revision: {type: integer, minimum: 1}
        spec: {type: object}
    DraftRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, minimum: 1}
    ValidationDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, pointer, node_id, message]
      properties:
        code: {type: string}
        severity: {type: string, enum: [error, warning]}
        pointer: {type: string}
        node_id: {type: string, nullable: true}
        message: {type: string}
    ValidationReport:
      type: object
      additionalProperties: false
      required: [valid, schema_version, draft_revision, diagnostics]
      properties:
        valid: {type: boolean}
        schema_version: {type: string}
        draft_revision: {type: integer, minimum: 1}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/ValidationDiagnostic'}
    PublishAgentVersionResponse:
