openapi: 3.1.0
info:
  title: Control API
  version: 1.0.0
  description: V1 HTTP contract for Identity, platform administration, and Tenant membership.
servers:
  - url: /
tags:
  - name: Health
  - name: Identity
  - name: Admin
  - name: Tenant
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      tags: [Health]
      responses:
        '204':
          description: The process is serving requests.
  /v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Log in with a local username and password
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded and a server-side session was created.
          headers:
            Set-Cookie:
              description: HttpOnly opaque session cookie. The token is never returned in JSON.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: The per-process, per-peer login attempt limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until the current fixed window expires.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Identity]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      tags: [Identity]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current identity and password rotation state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me/change-password:
    post:
      operationId: changeCurrentPassword
      summary: Replace the current password and unlock a restricted session
      tags: [Identity]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204':
          description: Password changed; other sessions were revoked.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me/tenants:
    get:
      operationId: listMyTenants
      summary: List Tenant memberships for the current user
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant memberships.
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: {$ref: '#/components/schemas/TenantMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: getTenant
      summary: Get a Tenant visible to the current member
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant and caller role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listTenantMembers
      summary: List members of a Tenant
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: addTenantMember
      summary: Add an existing active user as a Tenant member
      tags: [Tenant]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: removeTenantMember
      summary: Remove a non-owner member from a Tenant
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Membership removed.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/capabilities:
    get:
      operationId: getAdminCapabilities
      summary: Get fixed V1 platform administration capabilities
      tags: [Admin]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Active operator capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [capabilities]
                properties:
                  capabilities:
                    type: array
                    items: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/operators:
    get:
      operationId: listPlatformOperators
      summary: List active Platform Operators
      tags: [Admin]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Active Platform Operators.
          content:
            application/json:
              schema:
                type: object
                required: [operators]
                properties:
                  operators:
                    type: array
                    items: {$ref: '#/components/schemas/Operator'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: grantPlatformOperator
      summary: Grant platform administration to an existing active user
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GrantOperatorRequest'}
      responses:
        '201':
          description: Operator grant is active.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operator'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/operators/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: revokePlatformOperator
      summary: Revoke a Platform Operator while preserving at least one operator
      tags: [Admin]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Operator grant revoked.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/users:
    get:
      operationId: listPlatformUsers
      summary: List global platform users
      tags: [Admin]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of global users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createPlatformUser
      summary: Create an active user with a temporary password
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Global user created; password change is required on first login.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/tenants:
    get:
      operationId: listTenantsForOperations
      summary: List Tenants for platform operations
      tags: [Admin]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of Tenants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: provisionTenant
      summary: Create a Tenant and an initial owner membership
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisionTenantRequest'}
      responses:
        '201':
          description: Tenant and initial owner membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: control_session
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    UserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    BadRequest:
      description: Request input is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: A valid session is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: The authenticated user is not authorized or must change a temporary password.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: The requested state change conflicts with current state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalError:
      description: The request could not be completed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, minLength: 1, maxLength: 1024, format: password}
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, password_change_required]
      properties:
        user: {$ref: '#/components/schemas/CurrentUser'}
        password_change_required: {type: boolean}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, minLength: 12, maxLength: 128, format: password}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, temporary_password]
      properties:
        username: {type: string, minLength: 3, maxLength: 32}
        display_name: {type: string, maxLength: 256}
        temporary_password: {type: string, minLength: 12, maxLength: 128, format: password}
    GrantOperatorRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: {type: string, minLength: 1}
    ProvisionTenantRequest:
      type: object
      additionalProperties: false
      required: [slug, name, owner_user_id]
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,31}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        owner_user_id: {type: string, minLength: 1}
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: {type: string, minLength: 1}
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, status, created_at, updated_at]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Operator:
      type: object
      additionalProperties: false
      required: [user_id, granted_at]
      properties:
        user_id: {type: string}
        username: {type: string}
        display_name: {type: string}
        granted_by: {type: string}
        granted_at: {type: string, format: date-time}
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, name, status, created_at, updated_at]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [ACTIVE]}
        owner_user_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    TenantMembership:
      type: object
      additionalProperties: false
      required: [id, slug, name, status, role, created_at, updated_at]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [ACTIVE]}
        role: {type: string, enum: [OWNER, MEMBER]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Membership:
      type: object
      additionalProperties: false
      required: [id, user_id, role, created_by, created_at]
      properties:
        id: {type: string}
        user_id: {type: string}
        role: {type: string, enum: [OWNER, MEMBER]}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    UserPage:
      type: object
      additionalProperties: false
      required: [users, offset, limit, total]
      properties:
        users:
          type: array
          items: {$ref: '#/components/schemas/User'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    TenantPage:
      type: object
      additionalProperties: false
      required: [tenants, offset, limit, total]
      properties:
        tenants:
          type: array
          items: {$ref: '#/components/schemas/Tenant'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
